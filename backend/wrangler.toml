[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PlayerProfile"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["UsernameRegistry"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Leaderboard"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ModerationHub"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "PLAYER_PROFILE"
class_name = "PlayerProfile"

[[durable_objects.bindings]]
name = "USERNAME_REGISTRY"
class_name = "UsernameRegistry"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[durable_objects.bindings]]
name = "MODERATION_HUB"
class_name = "ModerationHub"

